# Stellt den Hotel-Ranker auf einem frischen Ubuntu-Server bereit.
# Ein zweiter Lauf aendert nichts (changed=0).
- name: Hotel-Ranker bereitstellen
  hosts: servers
  become: true
  vars:
    app_dir: /opt/hotel-ranker
    service_user: hranker
    service_uid: 10001            # gleiche UID wie 'app' im Dockerfile
    image_name: hotel-ranker
    image_tag: "0.1.0"
    container_name: hotel-ranker
    # Welche Modellversion aktiv sein soll. Standard: die, auf die artifacts/current zeigt.
    # Rollback: ansible-playbook site.yml -e model_version=<aeltere Version>
    model_version: "{{ lookup('ansible.builtin.pipe', 'readlink ' ~ playbook_dir ~ '/../../artifacts/current') }}"

  tasks:
    - name: Docker installieren
      ansible.builtin.apt:
        name: docker.io
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Docker laeuft und startet beim Booten
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Service-User anlegen
      ansible.builtin.user:
        name: "{{ service_user }}"
        uid: "{{ service_uid }}"
        system: true
        shell: /usr/sbin/nologin
        create_home: false

    - name: Ordner fuer die Modelle anlegen
      ansible.builtin.file:
        path: "{{ app_dir }}/artifacts"
        state: directory
        owner: "{{ service_user }}"
        group: "{{ service_user }}"
        mode: "0755"

    - name: Modellversion kopieren
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../artifacts/{{ model_version }}/"
        dest: "{{ app_dir }}/artifacts/{{ model_version }}/"
        owner: "{{ service_user }}"
        group: "{{ service_user }}"
        mode: "0644"
        directory_mode: "0755"

    - name: current zeigt auf die aktive Modellversion
      ansible.builtin.file:
        src: "{{ model_version }}"
        dest: "{{ app_dir }}/artifacts/current"
        state: link
      notify: Container neu starten

    - name: Image-Archiv kopieren
      ansible.builtin.copy:
        src: "hotel-ranker-{{ image_tag }}.tar.gz"   # liegt in files/, erzeugt von: make image
        dest: "/tmp/hotel-ranker-{{ image_tag }}.tar.gz"
        mode: "0644"

    - name: Image laden
      community.docker.docker_image:
        name: "{{ image_name }}"
        tag: "{{ image_tag }}"
        load_path: "/tmp/hotel-ranker-{{ image_tag }}.tar.gz"
        source: load

    - name: Ports in der Firewall erlauben (SSH zuerst)
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: ["22", "8000"]

    - name: Firewall aktivieren, sonst alles Eingehende sperren
      community.general.ufw:
        state: enabled
        default: deny
        direction: incoming

    - name: Container starten
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ image_name }}:{{ image_tag }}"
        state: started
        restart_policy: unless-stopped
        published_ports: ["8000:8000"]
        volumes: ["{{ app_dir }}/artifacts:/models:ro"]
        env:
          MODEL_DIR: /models/current

  handlers:
    # Das Modell wird nur beim Start geladen, deshalb braucht ein Wechsel einen Neustart.
    - name: Container neu starten
      community.docker.docker_container:
        name: "{{ container_name }}"
        restart: true
