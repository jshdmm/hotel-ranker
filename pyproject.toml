[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hotel-ranker"
version = "0.1.0"
description = "Beliebtheitssortierung: Buchungswahrscheinlichkeit pro Hotel"
requires-python = ">=3.10"
dependencies = [
    "numpy==2.2.6",
    "pandas==2.3.3",
    "scikit-learn==1.7.2",
    "joblib==1.6.0",
    "fastapi==0.142.2",
    "pydantic==2.13.5",
    "uvicorn==0.54.0",
    "gunicorn==26.2.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.16.9"]

[tool.setuptools.packages.find]
where = ["src"]
